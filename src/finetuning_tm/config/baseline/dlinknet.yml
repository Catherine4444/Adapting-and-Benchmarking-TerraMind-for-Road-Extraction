seed_everything: 0

trainer:
  max_epochs: 100
  accelerator: auto
  strategy: auto
  devices: auto
  precision: bf16-mixed
  check_val_every_n_epoch: 1
  log_every_n_steps: 20
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: baseline_hpc_runs_rosa
      log_model: true
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/dlinknet/
        filename: dlinknet
        monitor: val/IoU_Road
        mode: max
        save_top_k: 1
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/IoU_Road
        patience: 20
        mode: max
    - class_path: custom_modules.callbacks.PredictionWriter
      init_args:
        output_dir: /kaggle/working/predictions/panels/dlinknet
        rgb_key: S2L2A
        rgb_indices: [0, 1, 2]
        positive_class: 1
        filename_stat: iou
  enable_checkpointing: true

model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_factory: DinkNetModelFactory
    model_args:
      bands:
        - RED
        - GREEN
        - BLUE
        - RED_EDGE_1
        - RED_EDGE_2
        - RED_EDGE_3
        - NIR_NARROW
        - NIR_BROAD
        - SWIR_1
        - SWIR_2
        - VV
        - VH
      num_classes: 2
    loss: dice
    ignore_index: -1
    freeze_backbone: false
    optimizer: AdamW
    lr: 0.00026347232271660046
    scheduler: ReduceLROnPlateau
    scheduler_hparams:
      patience: 4
      factor: 0.5
    class_names: ["Background", "Road"]
    plot_on_val: false

data: ../rosa_data/baseline_model_data.yml